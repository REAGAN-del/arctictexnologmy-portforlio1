<!DOCTYPE html>

<body class="min-w-[320px] overflow-x-hidden bg-slate-950 font-sans leading-relaxed text-slate-50">
    <header
        class="sticky top-0 z-10 flex min-h-[4.5rem] items-center justify-between gap-4 border-b border-slate-700 bg-slate-950/95 px-4 py-3 backdrop-blur sm:px-8">
        <div class="flex items-center gap-3 text-left">

                <img class="h-12 w-12 rounded-full object-cover sm:h-16 sm:w-16" src="logo.jpeg" alt="RegsTech logo">
            </div>

        </div>



        <nav id="site-navigation"
            class="absolute left-0 right-0 top-full hidden grid grid-cols-1 border-b border-slate-700 bg-slate-950/95 px-4 pb-4 md:static md:flex md:flex-row md:justify-end md:gap-4 md:border-0 md:bg-transparent md:p-0">
            <a class="py-2 text-slate-300 transition hover:text-cyan-300 md:px-2" href="index.html">Home</a>

            <a class="py-2 text-slate-300 transition hover:text-cyan-300 md:px-2" href="index.html#software">My
                Services</a>
        </nav>
        <button class="nav-toggle rounded-lg border border-slate-700 px-3 py-1 text-xl text-slate-50 md:hidden"
            type="button" aria-label="Toggle navigation" aria-controls="site-navigation"
            aria-expanded="false">&#9776;</button>
    </header>
    <main>
        <form action="https//:formsubmit.co/amambuareagan863@gmail.com" method="post"
            class="mx-auto my-8 w-[calc(100%-2rem)] max-w-3xl rounded-2xl border-4 border-slate-700 bg-slate-900 p-6 sm:w-[calc(100%-3rem)] sm:p-8">


            <div class="space-y-4">
                <article class="text-center">
                    <h1 id="contactHead" class="mb-3 text-3xl font-bold text-cyan-300">Contact me</h1>
                    <p id="contactInstructions" class="mb-4 text-slate-300">Please fill the form below to contact me.
                        I will get back to you as soon as
                        possible.</p>
                </article>
                <article class="w-full">
                    <label class="mb-2 block text-lg font-bold text-cyan-300" for="name">Full Name</label>
                    <input
                        class="w-full rounded-xl border-2 border-slate-600 bg-slate-800 px-3 py-2 text-slate-50 placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/40"
                        id="name" name="name" type="text" placeholder="Enter name" autocomplete="name">
                </article>
                <article class="w-full">
                    <label class="mb-2 block text-lg font-bold text-cyan-300" for="number">Phone Number</label>
                    <input
                        class="w-full rounded-xl border-2 border-slate-600 bg-slate-800 px-3 py-2 text-slate-50 placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/40"
                        id="number" name="phone" type="tel" placeholder="Enter number" autocomplete="tel">
                </article>
                <article class="w-full">
                    <label class="mb-2 block text-lg font-bold text-cyan-300" for="email">Email</label>
                    <input
                        class="w-full rounded-xl border-2 border-slate-600 bg-slate-800 px-3 py-2 text-slate-50 placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/40"
                        id="email" name="email" type="email" placeholder="Enter email" autocomplete="email">
                </article>
            </div>
            <div class="my-6 rounded-xl bg-slate-800/80 p-4">
                <article>
                    <label class="mb-2 block text-lg font-bold text-cyan-300" for="message">How can we help you?</label>
                    <input
                        class="min-h-40 w-full rounded-xl border-2 border-slate-600 bg-slate-800 px-3 py-2 text-slate-50 placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/40"
                        id="message" name="message" type="text" placeholder="Write your message">
                </article>
            </div>
            <div class="text-center">
                <button
                    class="rounded-xl bg-cyan-400 px-5 py-2 font-bold text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-300"
                    type="button">Send</button>
            </div>

        </form>
    </main>
    <footer class="mt-8 border-t border-slate-700 bg-zinc-900/95 px-4 pb-8 pt-6">

        <section class="mx-auto grid max-w-6xl  gap-8">

            <article class="min-w-0 text-[2px] ">
                <h2 class="mb-2 text-left text-base font-bold text-cyan-400">Contact</h2>
                <div class="flex gap-4">
                    <a class="block break-words text-sm leading-7 text-slate-300 transition hover:text-cyan-300"
                        href="mailto:amambuareagan863@gmail.com"><img src="email.png" alt="" class="w-8 h-8"></a>
                    <a class="block break-words text-sm leading-7 text-slate-300 transition hover:text-cyan-300"
                        href="tel:+237670205933"><img src="call.png" alt="" class="w-8 h-8"></a>
                    <a class="block break-words text-sm leading-7 text-slate-300 transition hover:text-cyan-300"
                        href="https://wa.me/237670205933"><img src="wasap.jpg" alt="" class="w-8 h-8"></a>
                    <a class="text-sm leading-7 text-slate-300"><img src="loction.png" alt="" class="w-8 h-8"></a>
                    <a
                        href=" https://www.linkedin.com/in/amambua-reagan-3aab95401?utm_source=share_via&utm_content=profile&utm_medium=member_android">
                        <img src="linktin.png" alt="" class="w-8 h-8">
                    </a>
                </div>
            </article>
        </section>
        <section class="mx-auto mt-6 max-w-6xl border-t border-slate-700 pt-4 text-center">
            <p class="break-words text-slate-300">All rights reserved &copy; 2026.</p>
        </section>
    </footer>
</body>
